version: 2

sources:
  - name: raw
    schema: raw
    tables:
      - name: events
        loaded_at_field: ingested_at
        freshness:
          warn_after: {count: 1, period: day}
          error_after: {count: 7, period: day}
        columns:
          - name: event_id
            tests: [unique, not_null]
          - name: event_type
            tests:
              - accepted_values:
                  values: [demand, fulfilled, backorder, replenishment_order,
                           shipment_dispatched, receipt, inventory_snapshot]
  - name: gold
    schema: gold
    tables:
      - name: daily_service
      - name: stockout_episodes
  - name: md
    schema: md
    tables:
      - name: parts
      - name: suppliers_history
  - name: ref
    schema: ref
    tables:
      - name: policy
