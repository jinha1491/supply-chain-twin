spark.master                                  local[4]
spark.driver.memory                           2g
spark.sql.session.timeZone                    UTC
spark.sql.shuffle.partitions                  8
spark.jars.ivy                                /root/.ivy2
spark.jars.packages                           org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3,org.apache.spark:spark-avro_2.12:3.5.3,org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.7.1,org.apache.iceberg:iceberg-aws-bundle:1.7.1,org.postgresql:postgresql:42.7.4
spark.sql.extensions                          org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.lake                        org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lake.catalog-impl           org.apache.iceberg.jdbc.JdbcCatalog
spark.sql.catalog.lake.uri                    jdbc:postgresql://postgres:5432/iceberg
spark.sql.catalog.lake.jdbc.user              twin
spark.sql.catalog.lake.jdbc.password          twin
spark.sql.catalog.lake.warehouse              s3://warehouse/
spark.sql.catalog.lake.io-impl                org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lake.s3.endpoint            http://seaweedfs:8333
spark.sql.catalog.lake.s3.path-style-access   true
spark.sql.catalog.lake.client.region          us-east-1
